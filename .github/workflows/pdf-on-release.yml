name: Build PDF and release
on:
  pull_request:
    types: 
      - closed
    branches: 
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate PDF files
        uses: lvignoli/typst-action@main
        with:
          source_file: |
            beitragsordnung.typ 
            nutzungsordnung.typ 
            satzung.typ 
            vollmacht-stimme-mv.typ 
            wahlordnung.typ
      - name: Upload PDF file 
        uses: actions/upload-artifact@v4
        with:
          name: PDF 
          path: |
            beitragsordnung.pdf 
            nutzungsordnung.pdf 
            satzung.pdf 
            vollmacht-stimme-mv.pdf 
            wahlordnung.pdf
          retention-days: 7
      - name: Get current date 
        id: date 
        run: echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: Release 
        uses: softprops/action-gh-release@v3
        with:
          name: "${{env.DATE}}"
          files: | 
            beitragsordnung.pdf 
            nutzungsordnung.pdf 
            satzung.pdf 
            vollmacht-stimme-mv.pdf 
            wahlordnung.pdf
