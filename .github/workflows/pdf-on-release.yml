name: Build PDF and release
on:
  pull_request:
    types: 
      - closed
    branches: 
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate PDF files
        uses: lvignoli/typst-action@main
        with:
          source_file: |
            beitragsordnung.typ 
            nutzungsordnung.typ 
            satzung.typ 
            vollmacht-stimme-mv.typ 
            wahlordnung.typ
      - name: Upload PDF file 
        uses: actions/upload-artifact@v4
        with:
          name: PDF 
          path: |
            beitragsordnung.pdf 
            nutzungsordnung.pdf 
            satzung.pdf 
            vollmacht-stimme-mv.pdf 
            wahlordnung.pdf
          retention-days: 7
      - name: Get current date 
        id: date 
        run: echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
      - name: Get commit stub 
        id: stub 
        run: echo "STUB=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Push tag 
        id: tag_version 
        uses: mathieudutour/github-tag-action@v6.2
        with: 
          github_token: ${{secrets.GITHUB_TOKEN}}
          custom_tag: "${{env.DATE}}-${{env.STUB}}"
      - name: Release 
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{steps.tag_version.outputs.new_tag}}
          body: ${{steps.tag_version.outputs.changelog}}
          files: | 
            beitragsordnung.pdf 
            nutzungsordnung.pdf 
            satzung.pdf 
            vollmacht-stimme-mv.pdf 
            wahlordnung.pdf
